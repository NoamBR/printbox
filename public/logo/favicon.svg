<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PrintBox">
  <title>PrintBox</title>
  <!-- Warm deep-brown background (gift-box leather feel) -->
  <rect width="64" height="64" rx="10" fill="#1B1814"/>
  <!-- Ultra-thin gold inner frame (luxury hairline detail) -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="7.5" fill="none" stroke="#B89758" stroke-opacity="0.45" stroke-width="0.6"/>
  <!-- Italic serif P in cream -->
  <text x="32" y="46" text-anchor="middle" font-family="'Cormorant Garamond', Garamond, 'Times New Roman', serif" font-size="48" font-style="italic" font-weight="500" fill="#EEE7D4">P</text>
  <!-- Small gold accent dot -->
  <circle cx="48" cy="17" r="2" fill="#B89758"/>
</svg>
