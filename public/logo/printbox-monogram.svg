<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="PrintBox monogram">
  <title>PrintBox</title>
  <defs>
    <style>
      .pb-mono { font-family: "Cormorant Garamond", "Cormorant", "EB Garamond", "Garamond", "Georgia", serif; font-weight: 400; letter-spacing: 0.04em; }
    </style>
  </defs>
  <!-- The "box" -->
  <rect x="24" y="24" width="192" height="192" fill="none" stroke="rgb(40,32,24)" stroke-width="1.5"/>
  <!-- inner monogram PB -->
  <g fill="rgb(40,32,24)">
    <text x="120" y="148" text-anchor="middle" font-size="120" class="pb-mono">PB</text>
    <!-- small bottom mark -->
    <line x1="96" y1="178" x2="144" y2="178" stroke="rgb(40,32,24)" stroke-width="1" stroke-opacity="0.6"/>
  </g>
</svg>
