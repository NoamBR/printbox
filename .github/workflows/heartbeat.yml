name: PrintBox Heartbeat

# Fires the /api/cron/heartbeat endpoint every 12 hours so the owner gets
# a status email confirming the production environment is healthy.
#
# GitHub Actions cron runs in UTC. 03:00 UTC + 15:00 UTC ≈ 05:00 and 17:00
# Israel time (winter); 06:00 and 18:00 Israel time (summer).
#
# Required GitHub repo Secrets (Settings → Secrets and variables → Actions):
#   APP_BASE_URL   - https://print-box.store
#   CRON_SECRET    - the same long-random value set in Vercel env vars
#                    AND in local .env.local (must all match).

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit heartbeat endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_BASE_URL or CRON_SECRET missing in repo secrets"
            exit 1
          fi
          URL="${APP_BASE_URL%/}/api/cron/heartbeat"
          echo "GET $URL"
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 60 "$URL")
          echo "HTTP $HTTP_CODE"
          cat /tmp/response.json
          if [ "$HTTP_CODE" -ge 400 ]; then
            exit 1
          fi
