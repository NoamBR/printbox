<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <!-- Cream background panel -->
  <rect width="800" height="240" fill="#F4EFE3"/>
  <!-- Thin rectangular burgundy frame -->
  <rect x="40" y="48" width="720" height="144" fill="none" stroke="#590B00" stroke-width="2.5"/>
  <!-- Mask: Hebrew letters define where stripes are visible -->
  <defs>
    <mask id="hebrewMask">
      <rect width="800" height="240" fill="black"/>
      <text x="400" y="166" font-family="'Heebo', 'Arial Hebrew', 'David', sans-serif" font-size="135" font-weight="900" fill="white" text-anchor="middle" direction="rtl" letter-spacing="6">לנדוור</text>
    </mask>
  </defs>
  <!-- Exactly 5 horizontal burgundy stripes, clipped to letter shapes -->
  <g mask="url(#hebrewMask)">
    <rect x="0" y="76"  width="800" height="11" fill="#590B00"/>
    <rect x="0" y="94"  width="800" height="11" fill="#590B00"/>
    <rect x="0" y="112" width="800" height="11" fill="#590B00"/>
    <rect x="0" y="130" width="800" height="11" fill="#590B00"/>
    <rect x="0" y="148" width="800" height="11" fill="#590B00"/>
  </g>
</svg>
